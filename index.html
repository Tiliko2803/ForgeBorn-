<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><title>ForgeBorn — La primera hoja</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#17191f;color:#f4e7ce}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:18px 12px 4px}h1{font-size:clamp(28px,7vw,42px);margin:0;letter-spacing:3px;color:#ffc978}p{margin:7px;color:#bdb6ac}.wrap{max-width:760px;margin:auto;padding:10px 14px 30px}.panel{background:#24262d;border:1px solid #45414a;border-radius:18px;padding:14px;margin:12px 0}canvas{width:100%;height:auto;display:block;border-radius:14px;background:#12151c;touch-action:none;cursor:crosshair}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}.meter{height:12px;background:#101218;border-radius:10px;overflow:hidden;margin:8px 0 14px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9c3e21,#ffc56e);transition:width .2s}button{border:0;border-radius:12px;padding:13px 16px;background:#a9532c;color:white;font-weight:800;font-size:15px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button:last-child{background:#577b68}.hint{text-align:center;min-height:38px;font-size:14px}small{color:#bdb6ac}footer{text-align:center;font-size:12px;color:#aaa}@media(max-width:460px){.actions{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:span 2}}
</style></head><body><header><h1>⚒ FORGEBORN</h1><p>La primera hoja · Prototipo 0.1</p></header><main class="wrap"><section class="panel"><div class="stats"><span>🔥 Temperatura: <b id="temp">20°C</b></span><span>🔨 Golpes: <b id="hits">0</b></span><span>⚔️ Calidad: <b id="quality">0%</b></span></div><div class="meter"><div class="fill" id="heat"></div></div><canvas id="forge" width="700" height="420" aria-label="Yunque con hoja de metal interactiva"></canvas><p class="hint" id="msg" aria-live="polite">Calienta el metal y golpea la hoja para darle forma.</p><div class="actions"><button id="fire">🔥 Calentar</button><button id="hammer">🔨 Martillo: activo</button><button id="finish">⚔️ Terminar</button><button id="reset">↻ Nueva hoja</button></div></section><footer>ForgeBorn · HTML5 Canvas · Compatible con móvil y escritorio</footer></main>
<script>
(()=>{'use strict';
const c=document.getElementById('forge'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
const N=19, X=128, STEP=23, CY=220;let state,mode='hammer',particles=[];
function reset(){state={temp:20,hits:0,finished:false,edges:Array.from({length:N},(_,i)=>{let t=i/(N-1);return 49*(1-.72*Math.pow(t,5))}),marks:[]};particles=[];message('Calienta el metal y golpea la hoja para darle forma.');update();draw()}
function message(t){$('msg').textContent=t}
function update(){let q=quality();$('temp').textContent=Math.round(state.temp)+'°C';$('hits').textContent=state.hits;$('quality').textContent=q+'%';$('heat').style.width=Math.max(0,Math.min(100,(state.temp-20)/10))+'%';$('finish').disabled=state.finished;$('fire').disabled=state.finished}
function quality(){let e=state.edges,shape=e.reduce((s,v,i)=>s+Math.abs(v-(49*(1-.72*Math.pow(i/(N-1),5)))),0)/N;let worked=Math.min(1,state.hits/16);return Math.round(Math.max(0,Math.min(100,worked*65+Math.min(35,shape*2))))}
function bladePath(){ctx.beginPath();ctx.moveTo(X,CY-state.edges[0]);for(let i=1;i<N;i++)ctx.lineTo(X+i*STEP,CY-state.edges[i]);ctx.lineTo(X+(N-1)*STEP+28,CY);for(let i=N-1;i>=0;i--)ctx.lineTo(X+i*STEP,CY+state.edges[i]);ctx.closePath()}
function draw(){ctx.clearRect(0,0,700,420);let bg=ctx.createLinearGradient(0,0,0,420);bg.addColorStop(0,'#202634');bg.addColorStop(1,'#11151b');ctx.fillStyle=bg;ctx.fillRect(0,0,700,420);
ctx.fillStyle='#333943';ctx.fillRect(65,286,575,38);ctx.fillStyle='#222831';ctx.fillRect(110,324,485,42);ctx.fillStyle='#171a21';ctx.fillRect(235,365,230,40);
ctx.fillStyle='#5c4030';ctx.fillRect(45,CY-13,95,26);ctx.fillStyle='#b28c55';ctx.fillRect(114,CY-25,18,50);
let hot=Math.max(0,Math.min(1,(state.temp-350)/650));bladePath();ctx.save();ctx.shadowColor=hot>.1?'#ff6b24':'#7e9caf';ctx.shadowBlur=hot*38;let metal=ctx.createLinearGradient(0,CY-60,0,CY+60);metal.addColorStop(0,hot>.15?'#ffb35b':'#aab8c8');metal.addColorStop(.5,hot>.15?'#ff7035':'#68798b');metal.addColorStop(1,hot>.15?'#c84b27':'#c0cad3');ctx.fillStyle=metal;ctx.fill();ctx.strokeStyle=hot>.15?'#ffdc91':'#d6e0e7';ctx.lineWidth=2;ctx.stroke();ctx.restore();
ctx.save();bladePath();ctx.clip();ctx.strokeStyle='rgba(28,30,37,.3)';ctx.lineWidth=2;state.marks.forEach(m=>{ctx.beginPath();ctx.ellipse(m.x,m.y,7,3,m.angle,0,Math.PI*2);ctx.stroke()});ctx.restore();
particles.forEach(p=>{ctx.fillStyle='rgba(255,184,65,'+p.life/22+')';ctx.fillRect(p.x,p.y,3,3)});ctx.fillStyle='#8f9baa';ctx.font='14px system-ui';ctx.fillText('Toca la hoja para golpearla',220,65);if(state.finished){ctx.fillStyle='rgba(12,16,23,.8)';ctx.fillRect(0,0,700,420);ctx.fillStyle='#ffd08c';ctx.textAlign='center';ctx.font='bold 36px system-ui';ctx.fillText('¡HOJA FORJADA!',350,170);ctx.font='23px system-ui';ctx.fillText('Calidad: '+quality()+'%',350,220);ctx.textAlign='start'}}
function strike(x,y){if(state.finished)return;if(state.temp<550){message('Metal demasiado frío. Caliéntalo por encima de 550°C.');return}let index=Math.round((x-X)/STEP);if(index<0||index>=N||Math.abs(y-CY)>state.edges[index]+18){message('Apunta a la hoja, no al yunque.');return}let side=y<CY?-1:1;for(let j=Math.max(0,index-2);j<=Math.min(N-1,index+2);j++){let influence=Math.exp(-Math.pow((j-index)/1.25,2));state.edges[j]=Math.max(8,Math.min(67,state.edges[j]+(side===-1?-5.2:3.8)*influence))}state.marks.push({x,y,angle:Math.random()*.5-.25});state.hits++;state.temp=Math.max(20,state.temp-38);for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*7,life:22});message('¡CLANG! El metal se deforma donde golpeas.');update();draw()}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();strike((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height)});
$('fire').onclick=()=>{if(state.finished)return;state.temp=Math.min(1100,state.temp+240);message(state.temp>=550?'¡Al rojo vivo! Ahora golpea distintas zonas.':'Sigue calentando hasta 550°C.');update();draw()};
$('hammer').onclick=()=>message('Martillo equipado. Toca la parte superior o inferior de la hoja.');
$('finish').onclick=()=>{if(state.hits<5){message('Necesitas al menos 5 golpes para terminar la hoja.');return}state.finished=true;message('¡Primera arma terminada! Puedes crear otra hoja.');update();draw()};
$('reset').onclick=reset;
let last=performance.now();function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!state.finished&&state.temp>20){state.temp=Math.max(20,state.temp-dt*10);update()}particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life--}draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
})();
</script></body></html>
