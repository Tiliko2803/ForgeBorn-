<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><title>ForgeBorn — La primera hoja</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#17191f;color:#f4e7ce}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:18px 12px 4px}h1{font-size:clamp(28px,7vw,42px);margin:0;letter-spacing:3px;color:#ffc978}p{margin:7px;color:#bdb6ac}.wrap{max-width:760px;margin:auto;padding:10px 14px 30px}.panel{background:#24262d;border:1px solid #45414a;border-radius:18px;padding:14px;margin:12px 0}canvas{width:100%;height:auto;display:block;border-radius:14px;background:#12151c;touch-action:none;cursor:crosshair}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}.meter{height:12px;background:#101218;border-radius:10px;overflow:hidden;margin:8px 0 14px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9c3e21,#ffc56e);transition:width .2s}button{border:0;border-radius:12px;padding:13px 16px;background:#a9532c;color:white;font-weight:800;font-size:15px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button:last-child{background:#577b68}.hint{text-align:center;min-height:38px;font-size:14px}small{color:#bdb6ac}footer{text-align:center;font-size:12px;color:#aaa}@media(max-width:460px){.actions{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:span 2}}
.weapon-picker{display:flex;align-items:center;gap:12px;margin:10px 0 15px;flex-wrap:wrap}.weapon-picker select{background:#343944;color:#fff1d7;border:1px solid #73604b;border-radius:10px;padding:10px 12px;font:inherit;flex:1;min-width:160px}</style></head><body><header><h1>⚒ FORGEBORN</h1><p>La primera hoja · Prototipo 0.5</p></header><main class="wrap"><section class="panel"><div class="stats"><span>🔥 Temperatura: <b id="temp">20°C</b></span><span>🔨 Golpes: <b id="hits">0</b></span><span>⚔️ Calidad: <b id="quality">0%</b></span></div><div class="meter"><div class="fill" id="heat"></div></div><canvas id="forge" width="700" height="420" aria-label="Yunque con hoja de metal interactiva"></canvas><p class="hint" id="msg" aria-live="polite">Calienta el metal y moldea la silueta marcada.</p><div class="panel" style="padding:10px;margin:8px 0"><div class="stats"><strong>Etapa: <span id="stage">Moldear</span></strong><span id="progress">1 / 4</span></div><p id="stageHelp" style="font-size:13px">Da forma a la pieza con al menos 5 golpes.</p><button id="nextStage" style="width:100%;background:#577b68">Siguiente etapa →</button></div><div class="weapon-picker"><label for="weapon">Arma a forjar: </label><select id="weapon"><option value="dagger">🗡️ Daga</option><option value="sword" selected>⚔️ Espada</option><option value="greatsword">🗡️ Mandoble</option><option value="axe">🪓 Hacha</option><option value="mace">🔨 Mazo</option><option value="morningstar">✴️ Lucero del alba</option></select></div><div class="stats"><span>🎯 Precisión: <b id="accuracy">0%</b></span><span>🔧 Objetivo: <b id="weaponName">Espada</b></span></div><div class="actions"><button id="fire">🔥 Calentar</button><button id="hammer">🔨 Martillo</button><button id="fuller">〰️ Acanalar</button><button id="finish">⚔️ Terminar</button><button id="reset">↻ Nueva hoja</button></div></section><footer>ForgeBorn · HTML5 Canvas · Compatible con móvil y escritorio</footer></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('forge'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const N=21,X=118,STEP=22,CY=215,BASE=49;
let s,particles=[],hammer=null,last=performance.now();const weapons={dagger:'Daga',sword:'Espada',greatsword:'Mandoble',axe:'Hacha',mace:'Mazo',morningstar:'Lucero del alba'};let weapon='sword',tool='hammer';const stages=['Moldear','Acanalar','Templar','Afilar'];const needsGroove=()=>weapon==='dagger'||weapon==='sword'||weapon==='greatsword';const needsEdge=()=>!blunt();const blunt=()=>weapon==='mace'||weapon==='morningstar';
const target=i=>{const t=i/(N-1);if(weapon==='dagger')return Math.max(5,35*(1-Math.pow(t,2)));if(weapon==='greatsword')return Math.max(6,54-12*t-34*Math.pow(t,7));if(blunt()){const head=Math.exp(-Math.pow((t-.84)/.13,2));return Math.max(9,10+(weapon==='mace'?35:30)*head)}if(weapon==='axe'){const head=Math.exp(-Math.pow((t-.83)/.17,2));return Math.max(9,13+42*head-10*Math.pow(t,12))}return Math.max(5,44-18*t-16*Math.pow(t,5))};
const initial=i=>BASE*(1-.68*Math.pow(i/(N-1),6));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function msg(t){$('msg').textContent=t}
function reset(){$('weaponName').textContent=weapons[weapon];s={temp:20,hits:0,finished:false,stage:0,tempered:false,sharpness:0,grooves:[],top:Array.from({length:N},(_,i)=>initial(i)),bottom:Array.from({length:N},(_,i)=>initial(i)),marks:[]};particles=[];hammer=null;msg('Calienta el metal y moldea la silueta de '+weapons[weapon].toLowerCase()+'.');update()}
function precision(){let error=0;for(let i=0;i<N;i++){error+=Math.abs(s.top[i]-target(i))+Math.abs(s.bottom[i]-target(i))}return Math.round(clamp(100-error/(N*2*45)*100,0,100))}
function quality(){const grooveBonus=s.grooves.length?Math.min(12,s.grooves.length*2):0;return Math.round(clamp(precision()*.72+Math.min(20,s.hits*1.25)+(blunt()?8:grooveBonus)+(s.tempered?5:0)+Math.min(5,s.sharpness),0,100))}
function update(){$('stage').textContent=stages[s.stage];$('progress').textContent=(s.stage+1)+' / 4';$('stageHelp').textContent=['Golpea el metal caliente al menos cinco veces.','Traza el canal o continúa si tu arma no lo necesita.','Calienta a 750–950 °C y pulsa Templar.','Toca el filo varias veces para afilar o continúa si es contundente.'][s.stage];$('nextStage').textContent=s.stage===2?'🔥 Templar':s.stage===3?'✓ Listo para terminar':'Siguiente etapa →';$('temp').textContent=Math.round(s.temp)+'°C';$('hits').textContent=s.hits;$('quality').textContent=quality()+'%';$('accuracy').textContent=precision()+'%';$('heat').style.width=clamp((s.temp-20)/10,0,100)+'%';$('finish').disabled=s.finished;$('fire').disabled=s.finished}
function outline(top,bottom,tip=24){ctx.beginPath();ctx.moveTo(X,CY-top[0]);for(let i=1;i<N;i++)ctx.lineTo(X+i*STEP,CY-top[i]);ctx.lineTo(X+(N-1)*STEP+tip,CY);for(let i=N-1;i>=0;i--)ctx.lineTo(X+i*STEP,CY+bottom[i]);ctx.closePath()}
function draw(){ctx.clearRect(0,0,700,420);const bg=ctx.createLinearGradient(0,0,0,420);bg.addColorStop(0,'#202634');bg.addColorStop(1,'#10141a');ctx.fillStyle=bg;ctx.fillRect(0,0,700,420);
ctx.fillStyle='#343b45';ctx.fillRect(65,280,575,38);ctx.fillStyle='#222831';ctx.fillRect(110,318,485,42);ctx.fillStyle='#171a21';ctx.fillRect(235,360,230,42);
ctx.fillStyle='#604332';ctx.fillRect(45,CY-13,95,26);ctx.fillStyle='#b28c55';ctx.fillRect(114,CY-25,18,50);
ctx.save();ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(125,231,183,.8)';ctx.lineWidth=3;outline(Array.from({length:N},(_,i)=>target(i)),Array.from({length:N},(_,i)=>target(i)));ctx.stroke();ctx.restore();
const hot=clamp((s.temp-350)/650,0,1);outline(s.top,s.bottom);ctx.save();ctx.shadowColor=hot>.1?'#ff6b24':'#7e9caf';ctx.shadowBlur=hot*35;const metal=ctx.createLinearGradient(0,CY-65,0,CY+65);metal.addColorStop(0,hot>.15?'#ffc477':'#b4c2d0');metal.addColorStop(.48,hot>.15?'#ff763c':'#66788b');metal.addColorStop(1,hot>.15?'#b94725':'#c2ccd6');ctx.fillStyle=metal;ctx.fill();ctx.strokeStyle=hot>.15?'#ffe0a1':'#dce6ed';ctx.lineWidth=2;ctx.stroke();ctx.restore();
ctx.save();outline(s.top,s.bottom);ctx.clip();ctx.strokeStyle='rgba(30,35,43,.32)';ctx.lineWidth=2;s.marks.forEach(m=>{ctx.beginPath();ctx.ellipse(m.x,m.y,8,3,m.angle,0,Math.PI*2);ctx.stroke()});ctx.restore();
if(s.grooves.length){ctx.save();outline(s.top,s.bottom);ctx.clip();ctx.lineCap='round';ctx.strokeStyle='rgba(28,37,50,.75)';ctx.lineWidth=8;ctx.beginPath();s.grooves.forEach((g,i)=>{if(i===0)ctx.moveTo(g.x,g.y);else ctx.lineTo(g.x,g.y)});ctx.stroke();ctx.strokeStyle='rgba(239,222,189,.65)';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
if(blunt()){const hx=X+STEP*17,hy=CY;ctx.fillStyle='#d0d5dc';if(weapon==='morningstar'){for(let a=0;a<8;a++){const ang=a*Math.PI/4;ctx.beginPath();ctx.moveTo(hx+Math.cos(ang-.18)*27,hy+Math.sin(ang-.18)*27);ctx.lineTo(hx+Math.cos(ang)*44,hy+Math.sin(ang)*44);ctx.lineTo(hx+Math.cos(ang+.18)*27,hy+Math.sin(ang+.18)*27);ctx.fill()}}else{ctx.fillRect(hx-25,hy-38,55,76)}}
for(const p of particles){ctx.fillStyle='rgba(255,184,65,'+(p.life/25)+')';ctx.fillRect(p.x,p.y,3,3)}
if(hammer){const t=hammer.t;const bounce=t<.5?(-70+140*t):(-140*(t-.5));ctx.save();ctx.translate(hammer.x+20,hammer.y+bounce-35);ctx.rotate(-.55+t*.3);ctx.fillStyle='#966339';ctx.fillRect(-5,-9,10,95);ctx.fillStyle='#abb9c8';ctx.fillRect(-28,-18,56,28);ctx.fillStyle='#e0e5e8';ctx.fillRect(-28,-18,56,6);ctx.restore()}
ctx.fillStyle='#aab8c8';ctx.font='14px system-ui';ctx.fillText('Línea verde = forma objetivo',215,65);
if(s.finished){ctx.fillStyle='rgba(12,16,23,.85)';ctx.fillRect(0,0,700,420);ctx.fillStyle='#ffd08c';ctx.textAlign='center';ctx.font='bold 35px system-ui';ctx.fillText('¡HOJA FORJADA!',350,170);ctx.font='23px system-ui';ctx.fillText('Calidad: '+quality()+'% · Precisión: '+precision()+'%',350,220);ctx.textAlign='start'}}
function strike(x,y){if(s.finished)return;if(s.stage===2){msg('Usa el botón Templar cuando el metal esté entre 750 y 950°C.');return}if(s.stage===3){if(!needsEdge()){msg('Esta arma es contundente: no necesita afilado.');return}const i=Math.round((x-X)/STEP);if(i<0||i>=N||Math.abs(y-CY)<8||Math.abs(y-CY)>s[y<CY?'top':'bottom'][i]+16){msg('Toca cerca del filo exterior para afilar.');return}s.sharpness=Math.min(5,s.sharpness+1);msg('Afilado: '+s.sharpness+'/5');update();return}if(s.stage===1&&tool!=='fuller'){msg('Selecciona Acanalar para trabajar el canal.');return}if(s.stage===0&&tool!=='hammer'){msg('Primero moldea con el martillo.');return}if(tool==='fuller'){if(s.stage!==1){msg('El acanalado se realiza en la segunda etapa.');return}if(blunt()||weapon==='axe'){msg('El acanalado está disponible para daga, espada y mandoble.');return}if(s.temp<550){msg('Calienta el metal para acanalar.');return}const i=Math.round((x-X)/STEP);if(i<1||i>=N-1||Math.abs(y-CY)>18){msg('Traza el canal cerca del eje central de la hoja.');return}if(s.grooves.length>=14){msg('Canal completo. Puedes terminar el arma.');return}const previous=s.grooves[s.grooves.length-1];if(previous&&x<=previous.x+8){msg('Avanza de izquierda a derecha por el centro.');return}s.grooves.push({x,y});s.temp-=18;msg('Canal: '+s.grooves.length+'/14 segmentos.');update();return}if(s.temp<550){msg('Metal frío: caliéntalo por encima de 550°C.');return}let i=Math.round((x-X)/STEP);if(i<0||i>=N){msg('Golpea la hoja, no el yunque.');return}const side=y<CY?'top':'bottom';if(Math.abs(y-CY)>s[side][i]+15){msg('Apunta al metal.');return}
const strength=clamp((s.temp-400)/650,.25,1);for(let j=Math.max(0,i-3);j<=Math.min(N-1,i+3);j++){const falloff=Math.exp(-Math.pow((j-i)/1.3,2));s[side][j]=clamp(s[side][j]-6.5*strength*falloff,5,65);s[side==='top'?'bottom':'top'][j]=clamp(s[side==='top'?'bottom':'top'][j]+1.3*strength*falloff,5,65)}
s.marks.push({x,y,angle:Math.random()*.5-.25});s.hits++;s.temp=Math.max(20,s.temp-30);hammer={x,y,t:0};for(let k=0;k<15;k++)particles.push({x,y,vx:(Math.random()-.5)*11,vy:-Math.random()*8,life:25});msg('¡CLANG! Precisión actual: '+precision()+'%. Busca la línea verde.');update()}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();strike((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height)});
$('fire').onclick=()=>{if(s.finished)return;s.temp=Math.min(1100,s.temp+240);msg(s.temp>=550?'¡Al rojo vivo! Golpea para acercarte a la línea verde.':'Sigue calentando hasta 550°C.');update()};
$('hammer').onclick=()=>{tool='hammer';msg('Martillo equipado: golpea la hoja o la cabeza del arma.');$('hammer').style.outline='2px solid #ffc978';$('fuller').style.outline='none'};$('fuller').onclick=()=>{tool='fuller';msg('Acanalador equipado: toca puntos consecutivos del centro de izquierda a derecha.');$('fuller').style.outline='2px solid #ffc978';$('hammer').style.outline='none'};
$('nextStage').onclick=()=>{if(s.finished)return;if(s.stage===0&&s.hits<5){msg('Da al menos cinco golpes antes de continuar.');return}if(s.stage===1&&needsGroove()&&s.grooves.length<3){msg('Marca al menos tres puntos del canal.');return}if(s.stage===2){if(s.temp<750||s.temp>950){msg('Para templar, ajusta la temperatura entre 750 y 950°C.');return}s.tempered=true;s.temp=180;msg('Temple simplificado completado. Ahora toca afilar.')}else if(s.stage===3){msg('Usa Terminar para completar el arma.');return}if(s.stage<3)s.stage++;tool=s.stage===1?'fuller':'hammer';update()};$('finish').onclick=()=>{if(s.stage!==3||!s.tempered){msg('Completa todas las etapas antes de terminar.');return}if(needsEdge()&&s.sharpness<3){msg('Afila al menos tres zonas del filo.');return}s.finished=true;msg('¡Arma terminada! Puedes crear otra.');update()};
$('reset').onclick=reset;$('weapon').addEventListener('change',e=>{weapon=e.target.value;tool='hammer';reset()});
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!s.finished&&s.temp>20){s.temp=Math.max(20,s.temp-dt*10);update()}particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.23;p.life--}if(hammer){hammer.t+=dt*3;if(hammer.t>=1)hammer=null}draw();requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
})();
</script></body></html>
